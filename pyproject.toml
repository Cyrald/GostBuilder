[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "GostBuilder"
version = "0.1.0"
description = "Конвертер Markdown в DOCX по ГОСТ 7.32-2017 (pandoc + pandoc-crossref)"
readme = "README.md"
license = { file = "LICENSE" }
# Python 3.10+
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "lxml>=4.9.0",
	"docx-stitch>=1.0.0,<2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

# Программа запускается из папки проекта (python main.py): resources/ в
# пакет не входят, поэтому поддерживается только `pip install -e .`.
[tool.setuptools]
packages = ["core", "gui", "tools"]
py-modules = ["main"]

[tool.pytest.ini_options]
testpaths = ["tests"]
